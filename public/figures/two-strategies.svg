<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Newsreader, Georgia, serif" fill="#1c1c1a">
  <title>Two ways to invest for one year: a one-year bond with a certain payoff, or a two-year bond sold after one year with an uncertain payoff</title>
  <defs>
    <style>
      .tl { stroke: #1c1c1a; stroke-width: 1.5; }
      .s1 { stroke: #6b7a1e; stroke-width: 2; fill: none; }
      .s2 { stroke: #8f4b7c; stroke-width: 2; fill: none; }
      .fan { stroke: #8f4b7c; stroke-width: 1; fill: none; stroke-dasharray: 3 3; opacity: 0.7; }
      .lab { font-size: 15px; }
      .sm { font-size: 12px; fill: #4d4b45; font-family: "Source Sans 3", Helvetica, Arial, sans-serif; }
      .mut { font-size: 11px; fill: #7d7a71; font-family: "Source Sans 3", Helvetica, Arial, sans-serif; }
      .money { font-size: 14px; }
      .p1 { fill: #6b7a1e; } .p2 { fill: #8f4b7c; }
    </style>
  </defs>

  <!-- timeline -->
  <g transform="translate(120,40)">
    <line class="tl" x1="0" y1="0" x2="480" y2="0" />
    <line class="tl" x1="0" y1="-8" x2="0" y2="8" />
    <line class="tl" x1="240" y1="-8" x2="240" y2="8" />
    <line class="tl" x1="480" y1="-8" x2="480" y2="8" />
    <text class="sm" x="0" y="-14" text-anchor="middle">Date 0</text>
    <text class="sm" x="240" y="-14" text-anchor="middle">Date 1</text>
    <text class="sm" x="480" y="-14" text-anchor="middle">Date 2</text>
    <text class="mut" x="120" y="20" text-anchor="middle">Year 1</text>
    <text class="mut" x="360" y="20" text-anchor="middle">Year 2</text>
  </g>

  <!-- Strategy 1 -->
  <g transform="translate(120,120)">
    <text class="lab" x="-108" y="4">Strategy 1</text>
    <text class="mut" x="-108" y="20">One-year bond</text>
    <circle class="p1" cx="0" cy="0" r="4.5" />
    <text class="money" x="0" y="-12" text-anchor="middle">$1,000</text>
    <line class="s1" x1="8" y1="0" x2="232" y2="0" />
    <text class="sm" x="120" y="-6" text-anchor="middle" fill="#6b7a1e">8%</text>
    <circle class="p1" cx="240" cy="0" r="4.5" />
    <text class="money" x="240" y="-12" text-anchor="middle">$1,080</text>
    <text class="mut" x="240" y="22" text-anchor="middle">certain</text>
  </g>

  <!-- Strategy 2 -->
  <g transform="translate(120,215)">
    <text class="lab" x="-108" y="4">Strategy 2</text>
    <text class="mut" x="-108" y="20">Two-year bond,</text>
    <text class="mut" x="-108" y="34">sold at date 1</text>
    <circle class="p2" cx="0" cy="0" r="4.5" />
    <text class="money" x="0" y="-12" text-anchor="middle">$1,000</text>
    <line class="s2" x1="8" y1="0" x2="232" y2="0" />
    <text class="sm" x="120" y="-6" text-anchor="middle" fill="#8f4b7c">sell at whatever price the market sets</text>
    <!-- fan of possible prices -->
    <path class="fan" d="M232 0 L 236 -34" />
    <path class="fan" d="M232 0 L 238 -20" />
    <path class="fan" d="M232 0 L 240 0" />
    <path class="fan" d="M232 0 L 238 20" />
    <path class="fan" d="M232 0 L 236 34" />
    <circle class="p2" cx="240" cy="0" r="4.5" />
    <text class="money" x="252" y="-30">$1,141.51 if the year-2 rate is 6%</text>
    <text class="money" x="252" y="-8">$1,130.84 if 7%</text>
    <text class="money" x="252" y="14">$1,061.40 if 14%</text>
    <text class="mut" x="252" y="36">unknown until date 1</text>
  </g>
</svg>
